  }
  .portal:hover {
    color: var(--link-h);

  }

    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 32px;

  }

    flex-basis: 100%;
    white-space: normal;
    text-align: center;
  }
  .keywords .portal:hover {
    color: var(--link-h);
    transform: scale(1.06);
    z-index: 5;
  }
  @media (max-width: 640px) {
    .keywords { gap: 6px 20px; }
    .keywords .portal { font-size: 16px; }
  }

  /* ==================== SUN MODE ==================== */
  /* Bio at center; keywords radiate out like sunrays.
     Keywords stay horizontal for readability — distributed across
     three concentric rings + 360° spread. */
  .hero.sun {
    position: relative;
    width: 100vw;
    left: 50%;
    transform: translateX(-50%);
    height: calc(100vh - 100px);
    min-height: 820px;
    margin: 0 0 64px;
    padding: 0;
    display: block;
    overflow: hidden;
  }
  .hero.sun .sun-bio {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    max-width: 28ch;
    text-align: center;
    z-index: 2;
    padding: 20px;
    background: var(--bg);  /* keep bio readable if a keyword ring drifts close */
  }
  .hero.sun .sun-bio .lede {
    margin: 0;
    max-width: none;
  }
  .hero.sun .keywords {
    position: absolute;
    inset: 0;
    display: block;
    margin: 0;
    pointer-events: none;
  }
  .hero.sun .keywords .portal {
    position: absolute;
    left: 50%;
    top: 50%;
    pointer-events: auto;
    transform-origin: center;
    transform:
      translate(-50%, -50%)
      rotate(var(--angle, 0deg))
      translate(var(--r, 240px))
      rotate(calc(-1 * var(--angle, 0deg)));
    white-space: nowrap;
  }
  .hero.sun .keywords .portal:hover {
    transform:
      translate(-50%, -50%)
      rotate(var(--angle, 0deg))
      translate(var(--r, 240px))
      rotate(calc(-1 * var(--angle, 0deg)))
      scale(1.3);
    z-index: 5;
  }

    pointer-events: none;

</style>

const modalEl = document.querySelector('.portal-modal');
const backdropEl = document.querySelector('.portal-backdrop');

function openModal(data) {
  document.getElementById('portal-modal-title').textContent = data.title;
  const img = document.getElementById('portal-modal-img');
  if (data.img) { img.src = data.img; img.style.display = ''; img.alt = data.title; }
  else { img.style.display = 'none'; }
  document.getElementById('portal-modal-body').innerHTML = data.body.map(p => `<p>${p}</p>`).join('');
  const cta = document.getElementById('portal-modal-cta');
  cta.textContent = data.cta.label;
  cta.href = data.cta.href;
  modalEl.classList.add('open');
  backdropEl.classList.add('open');
  modalEl.scrollTop = 0;
}
function closeModal() {
  modalEl.classList.remove('open');
  backdropEl.classList.remove('open');
}

// Click — open modal on keyword; close on close-button / backdrop
document.addEventListener('click', e => {
  if (e.target.closest('.portal-modal-close')) {
    closeModal();
    return;
  }
  if (e.target.closest('.portal-backdrop')) {
    closeModal();
    return;
  }
  // ignore clicks inside the modal content
  if (e.target.closest('.portal-modal')) return;

  const portal = e.target.closest('.portal');
  if (portal && PORTALS[portal.dataset.key]) {
    e.preventDefault();
    openModal(PORTALS[portal.dataset.key]);
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && modalEl.classList.contains('open')) closeModal();
});

// Sun-mode keyword positioning: distribute spans on three concentric rings,
// evenly around 360°. Adapts to viewport on resize.
function arrangeSun() {
  const hero = document.querySelector('.hero.sun');
  if (!hero) return;
  const w = hero.clientWidth;
  const h = hero.clientHeight;
  const maxR = Math.min(w, h) * 0.42;
  const minR = maxR * 0.55;
  const midR = (maxR + minR) / 2;
  const radii = [minR, midR, maxR];
  const kws = hero.querySelectorAll('.keywords .portal');
  const n = kws.length;
  kws.forEach((el, i) => {
    const angle = (i / n) * 360 - 90; // start at 12 o'clock
    const r = radii[i % 3];
    el.style.setProperty('--angle', angle + 'deg');
    el.style.setProperty('--r', r + 'px');
  });
}
window.addEventListener('load', arrangeSun);
window.addEventListener('resize', arrangeSun);
// Run immediately too in case load already fired
arrangeSun();
