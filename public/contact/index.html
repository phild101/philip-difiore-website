<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg:#fff; --ink:#111; --dim:#888; --rule:#e8e8e8; --link-h:#c0392b; }
  html, body { width: 100%; height: 100vh; height: 100dvh; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'JetBrains Mono','SF Mono','IBM Plex Mono','Menlo',monospace;
    font-size: 13px; line-height: 1.7;
    display: flex;
    flex-direction: column;
  }
  a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--ink); }
  a:hover { color: var(--link-h); border-bottom-color: var(--link-h); }
  .dim { color: var(--dim); }

  /* header — matches redesign home */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 56px 64px 18px;
    border-bottom: 1px solid var(--rule);
    gap: 18px;
    flex-wrap: wrap;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }
  .logo { display: block; border-bottom: 0; }
  .logo img { display: block; width: 24px; height: 24px; }
  nav { display: flex; gap: 22px; font-size: 12px; }
  nav a { border-bottom: 0; }

  /* photo area — sized to fit within the homepage's 720px content column */
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 64px;
    min-height: 0;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }
  .photo-wrap {
    position: relative;
    line-height: 0;
  }
  .photo {
    display: block;
    max-height: calc(100vh - 180px);
    max-height: calc(100dvh - 180px);
    max-width: 100%;
    height: auto;
    width: auto;
  }
  .email {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'JetBrains Mono','SF Mono','IBM Plex Mono','Menlo',monospace;
    font-size: 13px;
    line-height: 1.7;
    color: #ffffff;
    text-decoration: none;
    border-bottom: 0;
    white-space: nowrap;
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.7);
    transition: opacity 0.3s;
  }
  .email:hover { opacity: 0.85; border-bottom: 0; color: #ffffff; }

  @media (max-width: 720px) {
    header { padding: 28px 22px 16px; }
    main { padding: 18px 14px; }
    .email { bottom: 16px; }
  }
</style>
